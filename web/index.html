<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="stt-token" content="{{ token }}">
  <link rel="icon" href="data:,">
  <title>STT Tools</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><h1>STT Tools</h1><small>本地语音转文字，文件不会离开本机</small></div><button class="icon-button" id="quit" title="退出应用" aria-label="退出应用">×</button></header>
    <section class="workspace">
      <div class="import-panel">
        <input id="file" type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.flac,.aac,.ogg,.opus,.wma,.mp4,.mov,.mkv,.webm,.avi,.m4v" hidden>
        <button class="dropzone" id="dropzone" type="button"><span class="upload-icon" aria-hidden="true">+</span><strong>选择文件，或拖到这里</strong><span>支持 MP3、WAV、M4A、MP4、MOV、MKV 等格式</span><small>单文件最大 4 GB · 最长 4 小时</small></button>
        <div class="settings"><label>识别模型<select id="model"><option value="tiny">轻巧 · 速度优先</option><option value="base" selected>日常 · 平衡推荐</option><option value="small">更准确 · 中文推荐</option></select></label><label>语言<select id="language"><option value="auto" selected>自动识别</option><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></label><label class="check"><input id="offline" type="checkbox"><span>仅离线</span><small>模型已在本地时可用</small></label></div>
      </div>
      <div class="result-panel"><div class="result-head"><div><h2 id="result-title">请选择你的文件</h2></div><div class="actions"><button id="copy" disabled>复制</button><button class="primary" id="export" disabled>导出 .md</button></div></div><div class="progress-wrap" id="progress-wrap" hidden><div class="status-row"><span id="status">正在准备…</span><button id="cancel">停止</button></div><div class="progress"><i id="progress"></i></div><small id="meta"></small></div><textarea id="transcript" spellcheck="false" placeholder="转写结果会出现在这里，你可以直接编辑…"></textarea><div class="empty"><span>⌁</span><p>文件导入后，文字会逐段出现在这里</p><small>你可以在导出前修正错字、补充标点</small></div></div>
    </section>
    <footer><span><i class="dot"></i> 完全本地运行</span><span>STT Tools · v0.1</span></footer>
  </main><script src="/static/app.js"></script>
</body></html>
